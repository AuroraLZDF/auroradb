name: CI

on:
  push:
  pull_request:

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version single source
        run: node tools/check-version.mjs

  frontend:
    name: Frontend (type-check / lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  backend:
    name: Backend (clippy / cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 在 Linux 上编译需要 WebKitGTK 等系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            pkg-config

      # tauri::generate_context!() 在编译期硬检查 frontendDist 路径存在。
      # runner 是干净环境没跑过前端 build，所以 stub 一个空 dist 目录
      # 让 proc macro 过校验即可（clippy 不执行 UI，不关心内容）。
      - name: Stub frontend dist for tauri proc macro
        run: |
          mkdir -p src-ui/dist
          echo '<!doctype html><html><body>ci stub</body></html>' > src-ui/dist/index.html

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # 用 --workspace：只测 src-tauri 会漏掉 crates/core 与 crates/pro 的全部单测
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace
