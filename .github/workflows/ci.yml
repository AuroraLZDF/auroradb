name: CI

on:
  push:
  pull_request:

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check version single source
        run: node tools/check-version.mjs

  frontend:
    name: Frontend (type-check / lint / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  backend:
    name: Backend (clippy / cargo test)
    runs-on: ubuntu-latest
    # 单测里的 mysql_* / pg_* 用例是 #[ignore] 的真实库回归，只有提供
    # AURORADB_TEST_* 环境变量才会执行。此处起两个 service 容器，让
    # 「真实 MySQL / PostgreSQL 链路」在每次 CI 都被覆盖——否则多驱动改造
    # 只会被 mock 层验证，回归要等到用户手里才暴露。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auroradb
          POSTGRES_PASSWORD: auroradb
          POSTGRES_DB: auroradb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auroradb -d auroradb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: auroradb
          MYSQL_DATABASE: auroradb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pauroradb --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 在 Linux 上编译需要 WebKitGTK 等系统库
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            pkg-config

      # tauri::generate_context!() 在编译期硬检查 frontendDist 路径存在。
      # runner 是干净环境没跑过前端 build，所以 stub 一个空 dist 目录
      # 让 proc macro 过校验即可（clippy 不执行 UI，不关心内容）。
      - name: Stub frontend dist for tauri proc macro
        run: |
          mkdir -p src-ui/dist
          echo '<!doctype html><html><body>ci stub</body></html>' > src-ui/dist/index.html

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # 用 --workspace：只测 src-tauri 会漏掉 crates/core 与 crates/pro 的全部单测
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # 真实数据库回归：上面 serve 的 postgres / mysql 容器。未配置环境变量时
      # 这些用例在本地静默跳过，CI 里则必须全部通过。
      - name: Test (real databases)
        env:
          AURORADB_TEST_MYSQL_HOST: 127.0.0.1
          AURORADB_TEST_MYSQL_PORT: 3306
          AURORADB_TEST_MYSQL_USER: root
          AURORADB_TEST_MYSQL_PASSWORD: auroradb
          AURORADB_TEST_MYSQL_DATABASE: auroradb_test
          AURORADB_TEST_PG_HOST: 127.0.0.1
          AURORADB_TEST_PG_PORT: 5432
          AURORADB_TEST_PG_USER: auroradb
          AURORADB_TEST_PG_PASSWORD: auroradb
          AURORADB_TEST_PG_DATABASE: auroradb_test
        run: cargo test --locked --workspace -- --ignored

  # E2E：跑在真实 Chromium 里，通过 e2e/support/tauri-mock.ts 注入伪造的 Tauri IPC，
  # 因此不需要 Tauri 运行时与数据库。Playwright 的 webServer 会自动起 vite dev。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json

      - name: Install
        run: npm ci

      # 与 package-lock 里 @playwright/test 的版本对齐，避免 headless shell 版本不匹配
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src-ui/playwright-report
          retention-days: 7
