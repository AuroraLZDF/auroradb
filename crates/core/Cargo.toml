[package]
name = "auroradb-core"
version = "2.2.4"
description = "AuroraDB core library: MySQL / PostgreSQL database client"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures-util = "0.3"
rust_decimal = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "chrono", "rust_decimal", "json", "uuid", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
