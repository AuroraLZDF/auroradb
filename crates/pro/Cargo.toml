[package]
name = "auroradb-pro"
version = "2.0.0"
description = "AuroraDB 专业版功能（私有）"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
auroradb-core = { path = "../core" }
anyhow = "1.0"
dirs = "5.0"
futures-util = "0.3"
russh = { version = "0.54", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "postgres", "chrono", "rust_decimal", "json", "uuid", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
