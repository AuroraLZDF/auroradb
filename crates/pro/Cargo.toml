[package]
name = "auroradb-pro"
version = "2.2.2"
description = "AuroraDB 增强功能（结构对比、监控、备份还原、ER 图、全局搜索、执行计划、SSH 隧道）"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"

[dependencies]
auroradb-core = { path = "../core" }
anyhow = "1.0"
dirs = "5.0"
futures-util = "0.3"
russh = { version = "0.54", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "postgres", "chrono", "rust_decimal", "json", "uuid", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
