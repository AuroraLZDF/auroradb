[package]
name = "auroradb"
version = "1.0.5"
description = "A MySQL database client with connection stability"
authors = ["Developer"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
# 自动更新：检查/下载/安装更新包，安装后需要重启进程
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
# 内置更新器只支持 AppImage；deb 安装需要自行下载安装包，直接复用已编译的 reqwest（rustls，不带 aws-lc）
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "postgres", "chrono", "rust_decimal", "json", "uuid", "tls-rustls"] }
# 流式读取结果集（fetch_many 返回 BoxStream，需要 TryStreamExt::try_next）
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
dirs = "5.0"
base64 = "0.21"
# 离线许可证：Ed25519 验签 + 机器指纹哈希
ed25519-dalek = "2"
sha2 = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
rust_xlsxwriter = "0.83"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# SSH 隧道：纯 Rust 实现，关闭默认特性避免拉入 aws-lc-rs（需 cmake/C 工具链），改用 ring
russh = { version = "0.54", default-features = false, features = ["ring", "rsa"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
